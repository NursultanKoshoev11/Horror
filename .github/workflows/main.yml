name: Unreal Engine CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  UE_VERSION: "5.5"
  PROJECT_NAME: "PolygonHorrorMansion"

jobs:
  validate-project:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    
    - name: Setup Unreal Engine
      shell: pwsh  # ← ИСПРАВЛЕНО: используем PowerShell вместо bash
      run: |
        Write-Host "🔧 Проверяем наличие UE..." -ForegroundColor Cyan
        $uePath = "F:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}"
        
        if (Test-Path $uePath) {
          Write-Host "✅ UE found at $uePath" -ForegroundColor Green
        } else {
          Write-Host "❌ UE not found at $uePath" -ForegroundColor Red
          Write-Host "Доступные версии UE:" -ForegroundColor Yellow
          Get-ChildItem "C:\Program Files\Epic Games\" -Directory | ForEach-Object { 
            Write-Host "  - $($_.Name)" 
          }
          exit 1
        }
    
    - name: Validate Project Files
      shell: pwsh  # ← PowerShell для Windows
      run: |
        $projectFile = "${{ env.PROJECT_NAME }}.uproject"
        Write-Host "📁 Проверка проекта: $projectFile" -ForegroundColor Cyan
        
        if (Test-Path $projectFile) {
          Write-Host "✅ Project file exists" -ForegroundColor Green
        } else {
          Write-Host "❌ Project file not found!" -ForegroundColor Red
          Write-Host "Available .uproject files:" -ForegroundColor Yellow
          Get-ChildItem -Filter "*.uproject" | ForEach-Object { 
            Write-Host "  - $($_.Name)" 
          }
          exit 1
        }
        
        # Проверка папок
        $requiredDirs = @("Content", "Source", "Config")
        foreach ($dir in $requiredDirs) {
          if (Test-Path $dir) {
            Write-Host "✅ Found $dir/" -ForegroundColor Green
          }
        }
    
    - name: Generate Project Files
      shell: cmd  # ← CMD для UBT
      run: |
        echo "🛠️ Генерация project files..."
        echo "UE Version: ${{ env.UE_VERSION }}"
        echo "Project: ${{ env.PROJECT_NAME }}.uproject"
        
        "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Binaries\DotNET\UnrealBuildTool\UnrealBuildTool.exe" -projectfiles -project="%CD%\${{ env.PROJECT_NAME }}.uproject" -game -rocket -progress
