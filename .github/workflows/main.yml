name: Unreal Engine Build

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  UE_VERSION: "5.5"
  PROJECT_NAME: "PolygonHorrorMansion"

jobs:
  build-project:
    runs-on: self-hosted

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive

    # -----------------------------------------------------------
    # FIND UNREAL ENGINE INSTALLATION
    # -----------------------------------------------------------
    - name: Locate Unreal Engine
      id: find_ue
      shell: powershell
      run: |
        Write-Host "🔍 Searching for Unreal Engine..." -ForegroundColor Cyan

        $possible = @(
          "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}",
          "D:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}",
          "F:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}"
        )

        $found = $null
        foreach ($p in $possible) {
          if (Test-Path $p) {
            $found = $p
            break
          }
        }

        if ($found -eq $null) {
          Write-Host "❌ UE NOT FOUND!" -ForegroundColor Red
          exit 1
        }

        Write-Host ("✅ UE found at: {0}" -f $found) -ForegroundColor Green
        echo "UE_PATH=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append


    # -----------------------------------------------------------
    # VALIDATE .uproject
    # -----------------------------------------------------------
    - name: Validate Project
      shell: powershell
      run: |
        $proj = "${{ env.PROJECT_NAME }}.uproject"
        if (-not (Test-Path $proj)) {
          Write-Host "❌ Project file not found: $proj" -ForegroundColor Red
          Get-ChildItem
          exit 1
        }
        Write-Host "📁 Found project file: $proj" -ForegroundColor Green


    # -----------------------------------------------------------
    # GENERATE PROJECT FILES (.sln)
    # -----------------------------------------------------------
    - name: Generate Solution
      shell: cmd
      run: |
        echo "🛠️ Generating project files..."
        "%UE_PATH%\Engine\Build\BatchFiles\GenerateProjectFiles.bat" -project="%CD%\${{ env.PROJECT_NAME }}.uproject" -game


    # -----------------------------------------------------------
    # BUILD + COOK + PAK + ARCHIVE
    # -----------------------------------------------------------
    - name: Build Shipping
      shell: cmd
      run: |
        echo "🚀 Building Shipping..."
        "%UE_PATH%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
          -project="%CD%\${{ env.PROJECT_NAME }}.uproject" ^
          -noP4 ^
          -build ^
          -cook ^
          -pak ^
          -stage ^
          -archive ^
          -clientconfig=Shipping ^
          -platform=Win64 ^
          -archivedirectory="%CD%\BuildOutput"


    # -----------------------------------------------------------
    # SAVE ARTIFACTS
    # -----------------------------------------------------------
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Game-Win64
        path: BuildOutput/
