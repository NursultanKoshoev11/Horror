name: Unreal Engine CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  UE_VERSION: "5.5"
  PROJECT_NAME: "PolygonHorrorMansion"
  PROJECT_FILE: "PolygonHorrorMansion.uproject"  # ← ИСПРАВЛЕНО: убрали ${{ }}

jobs:
  validate-project:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    
    - name: Setup Unreal Engine
      shell: bash
      run: |
        echo "🔧 Проверяем наличие UE..."
        if [ -d "C:/Program Files/Epic Games/UE_${{ env.UE_VERSION }}" ]; then
          echo "✅ UE found at C:/Program Files/Epic Games/UE_${{ env.UE_VERSION }}"
        else
          echo "❌ UE not found!"
          exit 1
        fi
    
    - name: Validate Project Files
      shell: bash
      run: |
        echo "📁 Проверка структуры проекта..."
        if [ ! -f "${{ env.PROJECT_FILE }}" ]; then
          echo "❌ Project file not found!"
          exit 1
        fi
        echo "✅ Project file exists"
        
        # Проверка основных папок
        for dir in "Content" "Source" "Config"; do
          if [ -d "$dir" ]; then
            echo "✅ Found $dir/"
          fi
        done
    
    - name: Generate Project Files
      shell: cmd
      run: |
        echo "🛠️ Генерация project files..."
        "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Binaries\DotNET\UnrealBuildTool\UnrealBuildTool.exe" -projectfiles -project="%CD%\${{ env.PROJECT_FILE }}" -game -rocket -progress
